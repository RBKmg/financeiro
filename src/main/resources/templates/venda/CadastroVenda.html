<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:salvavidas="http://salvavidas.net"
	xmlns:data="http://www.thymeleaf.org/extras/data">

<head>
	<title>Cadastro de venda</title>
	
	<link rel="stylesheet" type="text/css" th:href="@{/stylesheets/vendors/easy-autocomplete.min.css}"/>
	<link rel="stylesheet" type="text/css" th:href="@{/stylesheets/vendors/easy-autocomplete.themes.min.css}"/>
</head>

<section layout:fragment="conteudo">
	
	<div class="page-header">
		<div class="container-fluid">
			<div class="row">
				<div class="col-xs-10">
					<h1 th:if="${venda.nova}" th:text="#{venda.cadastro.titulo}">Cadastro de venda</h1>
					<h1 th:unless="${venda.nova}" th:text="#{venda.edicao.titulo(${venda.codigo})}">Edição da venda nº</h1><!--[[ ${venda.codigo} ]] -->
				</div>						
				
				<div class="col-xs-2">
					<div class="aw-page-header-controls">
						<a class="btn  btn-default" th:href="@{/vendas}">
							<i class="glyphicon  glyphicon-plus-sign"></i>
							<span class="hidden-xs  hidden-sm">Pesquisar</span>						
						</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	
	<div class="container-fluid">
		<form class="js-formulario-principal" method="POST" th:action="@{/vendas/nova}" th:object="${venda}">
			<!-- <input type="hidden" name="_csrf" th:value="${_csrf.token}">
			<input type="hidden" name="_csrf_header" th:value="${_csrf.headerName}"> -->
			
			<salvavidas:msgSuccessOrError/>
			
			<input type="hidden" id="uuid" th:field="*{uuid}"/>
			<input type="hidden" th:field="*{codigo}">
			<input type="hidden" th:field="*{usuario}">
			
			<div class="row">
				<div class="col-sm-4">
					<div class="aw-box">
						<div class="aw-box__icon">
							<i class="fa  fa-usd  fa-3x"></i>
						</div>
						<div class="aw-box__value  js-valor-total-negativo">
							R$ <span class="js-valor-total-box" th:text="${{venda.valorTotal}}">0,00</span>
						</div>
						<div class="aw-box__title">Total</div>
					</div>
				</div>
				
				<div class="col-sm-4">
					<div class="aw-box">
						<div class="aw-box__icon">
							<i class="fa  fa-tag  fa-3x"></i>
						</div>
						<div class="aw-box__value" th:text="${venda.status.descricao}">Orçamento</div>
						<div class="aw-box__title">Status</div>
					</div>
				</div>
				
				<div class="col-sm-4">
					<div class="aw-box">
						<div class="aw-box__icon">
							<i class="fa  fa-calendar  fa-3x"></i>
						</div>
						<div class="aw-box__value">
							<span class="js-tooltip" th:if="${venda.diasCriacao == 0}">Hoje</span>
							<span class="js-tooltip" th:if="${venda.diasCriacao == 1}">Há 1 dia</span>
							<span class="js-tooltip" th:if="${venda.diasCriacao > 1}">Há [[ ${venda.diasCriacao} ]] dias</span>
						</div>
						<div class="aw-box__title">Criação</div>
					</div>
				</div>
			</div>

			<div class="row">
				<div class="form-group  col-sm-4  sv-required" salvavidas:classforerror="cliente.codigo">
					<label class="control-label" for="nomeCliente">Cliente</label>
					<div class="input-group">
						<input id="codigoCliente" type="hidden" th:field="*{cliente}">
						<input id="nomeCliente" type="text" readonly="readonly" class="form-control" 
							placeholder="Clique na lupa para pesquisar o cliente" th:field="*{cliente.nome}"/>
				        
				        <span class="input-group-btn">
				        	<button class="btn  btn-default  js-tooltip" type="button" title="Pesquisa avançada" 
				        		data-toggle="modal" data-target="#pesquisaRapidaClientesModal" 
				        		th:disabled="${venda.StatusDaVendaCancelada_SalvarProibido}">
				        		<i class="glyphicon  glyphicon-search"></i>
				        	</button>
				      	</span>
				    </div>				    
				</div>
				
				<div class="form-group  col-sm-4">
					<label class="control-label" for="valorFrete">Valor do frete</label>
					<div class="input-group">
	      				<div class="input-group-addon">R$</div> 
						<input type="text" maxlength="14" class="form-control  js-decimal" id="valorFrete" 
							th:field="*{valorFrete}" th:data-valor="${venda.valorFrete}" 
							th:disabled="${venda.StatusDaVendaCancelada_SalvarProibido}"/>
					</div>
				</div>
				
				<div class="form-group  col-sm-4">
					<label class="control-label" for="valorDesconto">Valor do desconto</label>
					<div class="input-group">
	      				<div class="input-group-addon">R$</div> 
						<input type="text" maxlength="14" class="form-control  js-decimal" id="valorDesconto" 
							th:field="*{valorDesconto}" th:data-valor="${venda.valorDesconto}"
							th:disabled="${venda.StatusDaVendaCancelada_SalvarProibido}"/>
					</div>
				</div>
			</div>
			
			<div class="row">
				<div class="form-group  col-lg-12">
					<ul class="nav nav-tabs  js-abas-venda">
					  <li role="presentation" class="active"><a href="#livros">Livros</a></li>
					  <li role="presentation"><a href="#entrega">Entrega</a></li>
					</ul>
				</div>
			</div>
			
			<div class="tab-content">
				<div class="tab-pane active" id="livros">

					<div class="row">
						<div class="form-group  col-lg-12"> 
							<input type="text" class="form-control  js-isbn-ou-titulo-input" id="livro" 
								placeholder="Pesquise e adicione o livro por nome ou ISBN" autofocus="autofocus"
								th:data-url="@{/livros/filtro}"
								th:disabled="${venda.StatusDaVendaCancelada_SalvarProibido}"/>
						</div>
					</div>
					
					<div class="sv-tabela-livros  js-container-de-itens-de-venda" th:data-valor="${valorTotalItens}">											
						
						<th:block th:replace="venda/TabelaDeItensDeVenda"></th:block>
						<!--<div class="sv-tabela-livros__vazio">
							<i class="glyphicon  glyphicon-shopping-cart"></i> 
							<span>Você ainda não adicionou nenhum livro.</span>
						</div>-->
					</div>
				</div>
				
				<div class="tab-pane" id="entrega">
					<div class="row">
						<div class="form-group  col-sm-3" salvavidas:classforerror="dataEntrega">
							<label class="control-label" for="dataEntrega">Data da entrega</label>
							<input type="text" class="form-control  js-date" id="dataEntrega" th:field="*{dataEntrega}"
								th:disabled="${venda.StatusDaVendaCancelada_SalvarProibido}"/>
						</div>
						
						<div class="form-group  col-sm-3">
							<label class="control-label" for="horarioEntrega">Horário de entrega</label>
							<input type="text" class="form-control  js-horario" id="horarioEntrega" th:field="*{horarioEntrega}"
								th:disabled="${venda.StatusDaVendaCancelada_SalvarProibido}"/>
						</div>
					</div>
					
					<div class="row">
						<div class="form-group  col-sm-12">
							<textarea class="form-control" id="dataEntrega" rows="5" 
								placeholder="Alguma observação para o entregador desse pedido?" th:field="*{observacao}"
									th:disabled="${venda.StatusDaVendaCancelada_SalvarProibido}">
							</textarea>
						</div>
					</div>
				</div>
			</div>
			
			<div class="row" style="clear: both" th:if="${venda.SalvarPermitido}">
				<div class="col-lg-12">
					<div class="btn-group">
						<button type="submit" class="btn  btn-primary  js-submit-btn" data-acao="salvar">Salvar</button>
					    <button type="button" class="btn  btn-primary  dropdown-toggle" data-toggle="dropdown">
					    	<span class="caret"></span>
					    </button>
					  
					    <ul class="dropdown-menu">
					    	<li><a class="js-submit-btn" href="#" data-acao="salvarEmitir">Salvar e emitir</a></li>
					    	<li><a class="js-submit-btn" href="#" data-acao="salvarEnviarEmail">Salvar e enviar por e-mail</a></li>
					    </ul>
					</div>
				
					<button class="btn  btn-danger  js-submit-btn" data-acao="cancelar" th:unless="${venda.nova}">
						Cancelar
					</button>
				</div>
			</div>
		</form>
	</div>
	
	<th:block th:replace="~{clientes/PesquisaRapidaClientes :: modal}"></th:block>
	<th:block th:replace="~{handleBars/TemplateAutocompleteLivro}"></th:block>
</section>

<th:block layout:fragment="javascript-extra">
	<script th:src="@{/javascripts/vendors/jquery.easy-autocomplete.min.js}"></script>
	<script th:src="@{/javascripts/vendors/handlebars.min.js}"></script>	
	<script th:src="@{/javascripts/cliente.pesquisa-rapida.js}"></script>
	<script th:src="@{/javascripts/venda.autocomplete-itens.js}"></script>
	<script th:src="@{/javascripts/venda.tabela-itens.js}"></script>
	<script th:src="@{/javascripts/venda.js}"></script>
	<script th:src="@{/javascripts/venda.botoes-submit.js}"></script>
	
	<script>
		$(function() {
			$('.js-abas-venda a').click(function (e) {
				e.preventDefault();
				$(this).tab('show');
			});
		});
	</script>
</th:block>

</html>
