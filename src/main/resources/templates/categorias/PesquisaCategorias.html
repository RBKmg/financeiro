<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:salvavidas="http://salvavidas.net"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">
	
<head>
	<title>Pesquisa de categorias</title>
</head>

<body>	
	<section layout:fragment="conteudo">

		<div class="page-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-xs-10">
						<h1>
							Pesquisa de categorias
						</h1>
					</div>
					
					<div class="col-xs-2" sec:authorize-url="/categorias/novo">
						<div class="aw-page-header-controls">
							<a class="btn  btn-default" th:href="@{/categorias/novo}">
								<i class="glyphicon  glyphicon-plus-sign"></i>
								<span class="hidden-xs  hidden-sm">Nova categoria</span>						
							</a>
						</div>
					</div>
				</div>				
			</div>
		</div>

		<div class="container-fluid">
		
			<form method="GET" class="form-vertical  js-form-loading" th:object="${categoriasFilter}">				
				
				<div class="form-group">						
					<label class="control-label" for="nome">Nome</label>
					<input class="form-control" type="text" id="nome" th:field="*{nome}"/>		
				</div>
				
				<div class="form-group">
					<button class="btn  btn-primary" type="submit">Pesquisar</button>
				</div>
		
			</form>
			
			<div class="table-responsive  sv-tabela-simples">
				<table class="table  table-hover">
					<thead>
						<tr>
							<th class="table-categorias-col-codigo">
								Código
							</th>
							<th class="table-categorias-col-nome">
								<salvavidas:ordenacao page="${pagina}" field="nome" text="Nome"/>
							</th>						
							<th class="col-acoes"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="categoria : ${pagina.conteudo}">
							<td class="text-center" th:text="${categoria.codigo}">0</td>
							<td th:text="${categoria.nome}">Alcoólicos Anônimos</td>
							<td class="text-center">
								<a class="btn  btn-link  btn-xs  js-tooltip" title="Editar" sec:authorize="hasRole('ROLE_CADASTRAR_CATEGORIA')"
									href="#" th:href="@{/categorias/{codigo}(codigo=${categoria.codigo})}">
									<i class="glyphicon  glyphicon-pencil"></i>
								</a>
								
								<a class="btn  btn-link  btn-xs  js-tooltip  js-excluir-btn" title="Excluir" href="#"
									data:objeto="${categoria.nome}" data:url="@{/categorias/{codigo}(codigo=${categoria.codigo})}"
									sec:authorize="hasRole('ROLE_DELETAR_CATEGORIA')">
									<i class="glyphicon  glyphicon-remove"></i>
								</a>
							</td>
						</tr>
						
						<tr th:if="${#lists.isEmpty(pagina.conteudo)}">
							<td colspan="3">Nenhuma categoria encontrada</td>
						</tr>
					</tbody> 
				</table>
			</div>
			
			
			<salvavidas:paginacao page="${pagina}"/>
			
		</div>
		
	</section>	
</body>

</html>
