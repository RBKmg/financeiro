<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
	
<head>
	<title>Cadastro de categoria</title>
</head>

<body>	
	<section layout:fragment="conteudo">

		<div class="page-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-xs-10">
						<h1 th:if="${categoria.nova}">Cadastro de categoria</h1>
						<h1 th:unless="${categoria.nova}" th:text="|Edição de ${categoria.nome}|"></h1>
					</div>
					
					<div class="col-xs-2">
						<div class="aw-page-header-controls">
							<a class="btn  btn-default" th:href="@{/categorias}">
								<i class="glyphicon  glyphicon-plus-sign"></i>
								<span class="hidden-xs  hidden-sm">Pesquisar</span>						
							</a>
						</div>
					</div>
				</div>				
			</div>
		</div>

		<div class="container-fluid">
		
			<th:block th:include="fragments/MensagemSucesso"></th:block>
		
			<form method="post" class="form-vertical  js-form-loading" th:object="${categoria}" 
				th:action="${categoria.nova} ? @{/categorias/novo} : @{/categorias/{codigo}(codigo=${categoria.codigo})}">

				<th:block th:include="fragments/MensagemErroValidacao"></th:block>	
				
				<input type="hidden" th:field="*{codigo}">
				
				<div class="form-group  sv-required" th:classappend="${#fields.hasErrors('nome')} ? has-error">						
					<label class="control-label" for="nome">Nome</label>
					<input class="form-control" type="text" id="nome" th:field="*{nome}"/>		
				</div>
				
				<div class="form-group">
					<button class="btn  btn-primary" type="submit">Salvar</button>
				</div>
		
			</form>
		</div>
		
	</section>	
</body>

</html>
