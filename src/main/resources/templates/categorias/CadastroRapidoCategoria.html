<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">

<body>

	<div class="modal fade" id="modalCadastroRapidoCategoria" tabindex="-1" role="dialog" th:fragment="modal">
		<div class="modal-dialog  modal-sm">
		
			<div class="modal-content">				
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal">
						<span aria-hidden="true">&times;</span>
					</button>
					<h4 class="modal-title">Cadastro de categoria</h4>
				</div>
				
				<div class="modal-body">
					<div class="alert alert-danger  hidden  js-mensagem-cadastro-rapido-categoria" role="alert">
						
					</div>					
					
					<form class="form-horizontal" method="POST" th:action="@{/categorias}">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
           
						<div class="form-group  sv-required">
							<label class="col-sm-2  control-label" for="nomeCategoria">Nome</label>
							<div class="col-sm-10">
								<input class="form-control" type="text" id="nomeCategoria" autofocus="autofocus">
							</div>
						</div>
					</form>
										
					<button class="btn btn-primary  js-modal-botao-salvar-cadastro-categoria" type="button">Salvar</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">Cancelar</button>
				</div>
							
			</div>
			
		</div>
	</div>

</body>

</html>
