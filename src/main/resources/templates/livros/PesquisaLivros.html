<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:salvavidas="http://salvavidas.net"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">
	
<head>
	<title>Pesquisa de livros</title>
</head>

<body>
	<section layout:fragment="conteudo">
		
		<div class="page-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-xs-10">
						<h1>
							Pesquisa de livros
						</h1>
					</div>
					
					<div class="col-xs-2" sec:authorize-url="/livros/novo">
						<div class="aw-page-header-controls">
							<a class="btn  btn-default" th:href="@{/livros/novo}">
								<i class="glyphicon  glyphicon-plus-sign"></i>
								<span class="hidden-xs  hidden-sm">Novo livro</span>						
							</a>
						</div>
					</div>
				</div>				
			</div>
		</div>
		
		<div class="container-fluid">
			
			<form method="GET" class="form-vertical  js-form-loading" th:object="${livrosFilter}">
				
				<div class="row">					
					<div class="form-group  col-sm-6">						
						<label class="control-label" for="titulo">Título</label>
						<input class="form-control" type="text" id="titulo" th:field="*{titulo}"/>						
					</div>
					
					<div class="form-group  col-sm-6">						
						<label class="control-label" for="autor">Autor</label>
						<input class="form-control" type="text" id="autor" th:field="*{autor}"/>						
					</div>											
				</div>
				
				<div class="row">
					<div class="form-group  col-lg-3  col-sm-4">
						<label class="control-label">Origem</label>
						<div>
							<th:block th:each="origem : ${origens}">
								<div class="radio  radio-inline">
									<input type="radio" th:id="|id_${origem}|" th:value="${origem}" name="origem" th:field="*{origem}">
									<label th:for="|id_${origem}|" th:text="${origem.descricao}">Nacional</label>
								</div>	
							</th:block>
							
							<div class="radio  radio-inline">
								<input type="radio" id="todasOrigens" th:checked="*{origem} == null" name="origem">
								<label for="todasOrigens">Todas</label>							
							</div>												
						</div>						
					</div>
										
					<div class="form-group  col-sm-4">
						<label class="control-label" for="tipo">Tipo</label>						
						<select class="form-control" id="tipo" th:field="*{tipo}">
							<option value="">Selecione o tipo</option>
							<option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo.descricao}">Livro</option>
						</select>										
					</div>
					
					<div class="form-group  col-sm-4">
						<label class="control-label" for="valorDe">Valor Unitário</label>
						<div class="form-inline">
							<input class="form-control  aw-form-control-inline-sm  js-decimal" type="text" id="valorDe" th:field="*{valorDe}">
							<label class="aw-form-label-between" for="valorAte">até</label>
							<input class="form-control  aw-form-control-inline-sm  js-decimal" type="text" id="valorAte" th:field="*{valorAte}">
						</div>
					</div>					
				</div>
				
				<div class="form-group">
					<button class="btn  btn-primary" type="submit">Pesquisar</button>
				</div>
				
			</form>
			
			<div class="table-responsive  sv-tabela-simples">
				<table class="table  table-hover">
					<thead>
						<tr>
							<th class="table-livros-col-foto"></th>
							<th class="table-livros-col-titulo">
								<a th:href="${pagina.urlOrdenada('titulo')}" th:remove="${pagina.vazia} ? tag">
									<span>Título</span>
									<span class="dropup" th:remove="${pagina.descendente('titulo')} ? tag" th:if="${pagina.ordenada('titulo')}">
										<span class="caret"></span>
									</span>
								</a>
							</th>						
							<th class="table-livros-col-tipo">Tipo</th>
							<th class="table-livros-col-paginas">Páginas</th>
							<th class="table-livros-col-origem">Origem</th>
							<th class="table-livros-col-valor">Valor</th>
							<th class="col-acoes"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="livro : ${pagina.conteudo}">
							<td class="text-center">
								<img th:src="@{/fotos/thumbnail.{foto}(foto=${livro.fotoOuMock})}" class="img-responsive">
							</td>
							<td th:text="${livro.titulo}">Alcoólicos Anônimos</td>
							<td th:text="${livro.tipo.getDescricao()}">Livro</td>
							<td th:text="${livro.paginas}">234</td>
							<td th:text="${livro.origem.getDescricao()}">Nacional</td>
							<td class="text-right" th:text="|R$ ${{livro.valor}}|">R$ 52,00</td>
							<td class="text-center">
								<a class="btn  btn-link  btn-xs  js-tooltip" title="Editar" href="#" sec:authorize="hasRole('ROLE_CADASTRAR_LIVRO')"
									th:href="@{/livros/{codigo}(codigo=${livro.codigo})}">
									<i class="glyphicon  glyphicon-pencil"></i>
								</a>
								
								<a class="btn  btn-link  btn-xs  js-tooltip  js-excluir-btn" title="Excluir" href="#"
									data:objeto="${livro.titulo}" data:url="@{/livros/{codigo}(codigo=${livro.codigo})}"
									sec:authorize="hasRole('ROLE_DELETAR_LIVRO')">
									<i class="glyphicon  glyphicon-remove"></i>
								</a>
							</td>
						</tr>
						
						<tr th:if="${pagina.vazia}">
							<td colspan="7">Nenhum livro encontrado</td>
						</tr>
					</tbody> 
				</table>
			</div>
			
			
			<salvavidas:paginacao page="${pagina}"/>
				
		</div>
		
	</section>
	
</body>

</html>
