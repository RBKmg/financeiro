<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:salvavidas="http://salvavidas.net"
	xmlns:data="http://www.thymeleaf.org/extras/data">
	
<head>
	<title>Pesquisa de usuários</title>
</head>

<body>
	<section layout:fragment="conteudo">
		
		<div class="page-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-xs-10">
						<h1>
							Pesquisa de usuários
						</h1>
					</div>
					
					<div class="col-xs-2">
						<div class="aw-page-header-controls">
							<a class="btn  btn-default" th:href="@{/usuarios/novo}">
								<i class="glyphicon  glyphicon-plus-sign"></i>
								<span class="hidden-xs  hidden-sm">Novo usuário</span>						
							</a>
						</div>
					</div>
				</div>				
			</div>
		</div>
		
		<div class="container-fluid">
			<form method="GET" class="form-vertical  js-form-loading" th:object="${usuariosFilter}">				
				
				<div class="row">
					<div class="form-group  col-sm-6">						
						<label class="control-label" for="nome">Nome</label>
						<input class="form-control" type="text" id="nome" th:field="*{nome}"/>		
					</div>
					
					<div class="form-group  col-sm-6">						
						<label class="control-label" for="email">E-mail</label>
						<input class="form-control" type="text" id="email" th:field="*{email}"/>		
					</div>
				</div>
				
				<div class="row">				  	
					<div class="col-sm-12  col-xs-3  form-group">
						<label class="control-label">Grupos</label>
						<div>
							<th:block th:each="grupo : ${grupos}" style="margin-left: 0;">
								<div class="checkbox  checkbox-inline">
									<input type="checkbox" th:value="${grupo.codigo}" th:field="*{grupos}">
									<label th:for="${#ids.prev('grupos')}" th:text="${grupo.nome}">Administrador</label>
								</div>
							</th:block>							
						</div>						
					</div>
				</div>
				
				<div class="form-group" style="margin-bottom: 30px;">
					<button class="btn  btn-primary" type="submit">Pesquisar</button>
				</div>
		
			</form>
			
			<div class="aw-datatable-toolbar" sec:authorize="hasRole('ROLE_CADASTRAR_LANCAMENTO')">
				<button class="btn  btn-default  btn-xs  js-status-btn  disabled" data:status="ATIVAR" data:url="@{/usuarios/status}">
					<span>Ativar</span>
				</button>
				
				<button class="btn  btn-default  btn-xs  js-status-btn  disabled" data:status="DESATIVAR" data:url="@{/usuarios/status}">
					<span>Desativar</span>
				</button>
			</div>
			
			<div class="table-responsive  sv-tabela-simples">
				<table class="table  table-hover">
					<thead>
						<tr>
							<th class="table-usuarios-col-check">
								<div class="checkbox  aw-checkbox-no-margin">
									<input class="js-todos-usuarios-selecionados-checkbox" type="checkbox">
									<label></label>
								</div>
							</th>
							<th class="table-usuarios-col-nome">
								<salvavidas:ordenacao page="${pagina}" field="nome" text="Nome"/>
							</th>
							<th class="table-usuarios-col-email">
								E-mail
							</th>
							<th class="table-usuarios-col-grupos">
								Grupos
							</th>
							<th class="table-usuarios-col-ativo">
								Status
							</th>						
							<th class="col-acoes"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="usuario : ${pagina.conteudo}">
							<td>
								<div class="checkbox  aw-checkbox-no-margin" th:if="${#authentication.principal.usuario.codigo != usuario.codigo}">
									<input class="js-usuario-selecionado-checkbox" type="checkbox" data:codigo="${usuario.codigo}">
									<label></label>
								</div>
							</td>
							<td th:text="${usuario.nome}">José da Silva</td>
							<td th:text="${usuario.email}">josedasilva@mail.com</td>
							<td>
								<span th:each="grupo : ${usuario.grupos}" th:text="|${grupo.nome}${grupoStat.last ? '' : ', '}|">
									Administrador, Membro
								</span>
							</td>
							<td>
								<th:block th:if="${usuario.ativo}">
									<span class="label  label-success">Ativo</span>
								</th:block>
								<th:block th:if="${not usuario.ativo}">
									<span class="label  label-danger">Inativo</span>
								</th:block>
							</td>
							<td class="text-center">
								<a class="btn  btn-link  btn-xs  js-tooltip" title="Editar" sec:authorize="hasRole('ROLE_CADASTRAR_USUARIO')"
									href="#" th:href="@{/usuarios/{codigo}(codigo=${usuario.codigo})}">
									<i class="glyphicon  glyphicon-pencil"></i>
								</a>
								
								<a class="btn  btn-link  btn-xs  js-tooltip  js-excluir-btn" title="Excluir" sec:authorize="hasRole('ROLE_CADASTRAR_USUARIO')"								 
									href="#" data:objeto="${usuario.nome}" data:url="@{/usuarios/{codigo}(codigo=${usuario.codigo})}"
									th:if="${#authentication.principal.usuario.codigo != usuario.codigo}">
									<i class="glyphicon  glyphicon-remove"></i>
								</a>
							</td>
						</tr>
						
						<tr th:if="${pagina.vazia}">
							<td colspan="6">Nenhum usuário encontrado</td>
						</tr>
					</tbody> 
				</table>
				
			</div>
			
			<salvavidas:paginacao page="${pagina}"/>			
			
		</div>		
		
	</section>

	<th:block layout:fragment="javascript-extra">
		<script th:src="@{/javascripts/multiselecao.js}"></script>		
	</th:block>		
</body>
	
</html>
