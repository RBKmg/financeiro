<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
	
<head>
	<title>Cadastro de usuário</title>
	
	<link rel="stylesheet" type="text/css" th:href="@{/stylesheets/vendors/bootstrap-switch.min.css}"/>
</head>

<body>	
	<section layout:fragment="conteudo">

		<div class="page-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-xs-10">
						<h1 th:if="${usuario.novo}">Cadastro de usuário</h1>
						<h1 th:unless="${usuario.novo}">Edição de usuário - [[ ${usuario.nome} ]]</h1>
					</div>
					
					<div class="col-xs-2">
						<div class="aw-page-header-controls">
							<a class="btn  btn-default" th:href="@{/usuarios}">
								<i class="glyphicon  glyphicon-plus-sign"></i>
								<span class="hidden-xs  hidden-sm">Pesquisar</span>						
							</a>
						</div>
					</div>
				</div>				
			</div>
		</div>

		<div class="container-fluid">
		
			<form method="POST" class="form-vertical  js-form-loading" th:object="${usuario}" 
				th:action="${usuario.novo} ? @{/usuarios/novo} :  @{/usuarios/{codigo}(codigo=${usuario.codigo})}">
				
				<input type="hidden" th:field="*{codigo}">
				
				<salvavidas:msgSuccessOrError/>
				 
				<div class="form-group sv-required" salvavidas:classforerror="nome">						
					<label class="control-label" for="nome">Nome</label>
					<input class="form-control" type="text" id="nome" th:field="*{nome}"/>						
				</div>
				
				<div class="row">				  	
					<div class="col-sm-6  form-group  sv-required" salvavidas:classforerror="email">					
						<label class="control-label" for="email">Email</label> 
						<input class="form-control" type="text" id="email" th:field="*{email}"/>															
					</div>
					
					<div class="col-sm-3  form-group">					
						<label class="control-label" for="dataNascimento">Data de nascimento</label> 
						<input class="form-control  js-date" type="text" id="dataNascimento" th:field="*{dataNascimento}" autocomplete="off"/>	<!--data-date-today-highlight="true" -->														
					</div>
				</div>
				
				<div class="row">				  	
					<div class="col-sm-3  form-group" salvavidas:classforerror="senha" th:classappend="${usuario.novo} ? sv-required">					
						<label class="control-label" for="senha">Senha</label> 
						<input class="form-control" type="password" id="senha" th:field="*{senha}"/>															
					</div>
					
					<div class="col-sm-3  form-group" salvavidas:classforerror="confirmacaoSenha">					
						<label class="control-label" for="confirmacaoSenha">Confirmação de senha</label>
						<input class="form-control" type="password" id="confirmacaoSenha" th:field="*{confirmacaoSenha}"/>															
					</div>
					
					<div class="col-lg-4  col-sm-6  form-group" th:if="${#authentication.principal.usuario.codigo != usuario.codigo}">
						<label class="control-label">Status</label>
						<div>
							<input class="checkbox  js-status" type="checkbox"
							data-size="small" data-off-color="danger" data-on-text="Ativo" data-off-text="Inativo" th:field="*{ativo}">
						</div>																					
					</div>
				</div>
				
				<div class="row">				  	
					<div class="col-sm-12  col-xs-3  form-group  sv-required" salvavidas:classforerror="grupos">
						<label class="control-label">Grupos</label>
						<div>
							<th:block th:each="grupo : ${grupos}">
								<div class="checkbox  checkbox-inline" style="margin-left: 0;">
									<input type="checkbox" th:value="${grupo.codigo}" th:field="*{grupos}">
									<label th:for="${#ids.prev('grupos')}" th:text="${grupo.nome}">Administrador</label>
								</div>
							</th:block>							
						</div>						
					</div>
				</div>				
				
				<div class="form-group">
					<button class="btn  btn-primary" type="submit">Salvar</button>
				</div>
		
			</form>
		</div>
		
	</section>
	
	<th:block layout:fragment="javascript-extra">
		<script th:src="@{/javascripts/vendors/bootstrap-switch.min.js}"></script>		
		<script>
			$('.js-status').bootstrapSwitch();
		</script>
	</th:block>
</body>

</html>
