<head>
	<title>Dashboard</title>

		<div class="container-fluid">
			<h1>Dashboard</h1>

			<div class="col-sm-4">

					</div>

				</div>
			</div>

					<div class="aw-box__title">Itens no estoque</div>
				</div>
			</div>
			
			<div class="col-sm-4">
				<div class="aw-box">
					<div class="aw-box__icon">
						<i class="fa  fa-users  fa-3x"></i>
					</div>
					<!-- <div class="aw-box__value">[[${totalDeClientes}]]</div> -->
					<div class="aw-box__title">Total de clientes</div>
				</div>
			</div>
		</div>	
		

		<div class="row">
			<!-- <div class="col-sm-6">
				<div class="aw-graph-box">
					<div class="aw-graph-box__header">
						<h2 class="aw-graph-box__title">Vendas por mês <small>últimos 6 meses</small></h2>
					</div>
					<div class="aw-graph-box__content">
						<div class="aw-graph-box__no-data">
							<i class="fa  fa-line-chart  fa-2x"></i>
							<span>Não há dados</span>
						</div>
						<div>
							<canvas id="graficoVendaPorMes" height="160"></canvas>
						</div>
					</div>
				</div>
			</div> -->
			
			<div class="col-sm-12">
				<div class="aw-graph-box">
					<div class="aw-graph-box__header">
						<h2 class="aw-graph-box__title">Lançamentos por tipo <small>últimos 12 meses</small></h2>
					</div>
					<div class="aw-graph-box__content">
						<!--<div class="aw-graph-box__no-data">
							<i class="fa  fa-line-chart  fa-2x"></i>
							<span>Não há dados</span>
						</div>-->

							<canvas id="graficolancamentoAnualPorTipo" height="160"></canvas>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

<th:block layout:fragment="javascript-extra">
	<script th:src="@{/javascripts/vendors/Chart.min.js}"></script>
	<script th:src="@{/javascripts/lancamento.dashboard-anual.js}"></script>
