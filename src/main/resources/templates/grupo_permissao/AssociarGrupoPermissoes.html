<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:salvavidas="http://salvavidas.net"
	xmlns:data="http://www.thymeleaf.org/extras/data">
	
<head>
	<titl>Associar grupo permissão</title>
</head>

<body>
	<section layout:fragment="conteudo">
		
		<div class="page-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-xs-10">
						<h1>Associar e desassociar grupo e permissões</h1>
					</div>
					
					<div class="col-xs-2">
						<div class="aw-page-header-controls">
							<a class="btn  btn-default" th:href="@{/grupos}">
								<i class="glyphicon  glyphicon-plus-sign"></i>
								<span class="hidden-xs  hidden-sm">Pesquisar</span>						
							</a>
						</div>
					</div>
				</div>				
			</div>
		</div>
		
		
		<div class="container-fluid">
		
			<form method="POST" class="form-vertical  js-form-loading"  th:object="${grupo}"
				th:action="@{/grupos/{codigo}(codigo=${grupo.codigo})}">
				
				<input type="hidden" th:field="*{codigo}">
				
				<salvavidas:msgSuccessOrError/>
				 
				<div class="form-group">	
					<label class="control-label" for="nome">Grupo</label>
					<input class="form-control" type="text" id="nome" th:field="*{nome}" disabled/>		
				</div>
				
				<div class="row">				  	
					<div class="col-sm-12  col-xs-3  form-group">
						<label class="control-label">Permissões</label>
						<div>
							<th:block th:each="permissao : ${permissoes}">
								<div class="checkbox  checkbox-horizontal" style="margin-left: 0;">
									<input type="checkbox" th:value="${permissao.codigo}" th:field="*{permissoes}">
									<label th:for="${#ids.prev('permissoes')}" th:text="${permissao.nome}">
										ROLE_CADASTRAR_USUARIO
									</label>
								</div>
							</th:block>				
						</div>						
					</div>
				</div>				
				
				<div class="form-group">
					<button class="btn  btn-primary" type="submit">Salvar</button>
				</div>
		
			</form>
		</div>
		
		
	</section>

</body>

</html>
