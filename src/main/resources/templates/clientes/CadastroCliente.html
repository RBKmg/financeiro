<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:salvavidas="http://salvavidas.net"
	xmlns:data="http://www.thymeleaf.org/extras/data">
	
<head>
	<title>Cadastro de cliente</title>
</head>

<body>	
	<section layout:fragment="conteudo">

		<div class="page-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-xs-10">
						<h1 th:if="${cliente.novo}">Cadastro de cliente</h1>
						<h1 th:unless="${cliente.novo}" th:text="|Edição de ${cliente.nome}|">Edição de cliente</h1>
					</div>
					
					<div class="col-xs-2">
						<div class="aw-page-header-controls">
							<a class="btn  btn-default" th:href="@{/clientes}">
								<i class="glyphicon  glyphicon-plus-sign"></i>
								<span class="hidden-xs  hidden-sm">Pesquisar</span>								
							</a>
						</div>
					</div>
				</div>				
			</div>
		</div>

		<div class="container-fluid">
		
			<form method="POST" class="form-vertical  js-form-loading" th:object="${cliente}" 
				th:action="${cliente.novo} ? @{/clientes/novo} : @{/clientes/{codigo}(codigo=${cliente.codigo})}">
				
				<salvavidas:msgSuccessOrError/>
				
				<input type="hidden" th:field="*{codigo}"/> 
				 
				<div class="row">
					<div class="col-sm-12  form-group  sv-required" salvavidas:classforerror="nome">						
						<label class="control-label" for="nome">Nome</label>
						<input class="form-control" type="text" id="nome" th:field="*{nome}"/>						
					</div>
				</div>				
				
				<div class="row">				  	
					<div class="col-lg-4  col-sm-6  form-group  sv-required" salvavidas:classforerror="tipoPessoa">
						<label class="control-label">Tipo Pessoa</label>
						<div>
							<th:block th:each="tipoPessoa : ${tiposPessoa}">
								<div class="radio  radio-inline">
									<input class="js-radio-tipo-pessoa" type="radio" th:id="|id_${tipoPessoa}|" 
										th:field="*{tipoPessoa}" th:value="${tipoPessoa}"
										th:data-documento="${tipoPessoa.documento}", th:data-mascara="${tipoPessoa.mascara}">
									<label class="control-label" th:for="|id_${tipoPessoa}|" th:text="${tipoPessoa.descricao}">Física</label>
								</div>
							</th:block>
						</div>						
					</div>
					
					<div class="col-sm-8  form-group  sv-required" salvavidas:classforerror="cpfOuCnpj">					
						<label class="control-label" for="cpfOuCnpj">CPF/CNPJ</label> 
						<input class="form-control" type="text" id="cpfOuCnpj" th:field="*{cpfOuCnpj}" disabled/>															
					</div>
				</div>
				
				<div class="row">				  	
					<div class="col-sm-4  form-group">					
						<label class="control-label" for="telefone">Telefone</label> 
						<input class="form-control  js-phone-number" type="text" id="telefone" th:field="*{telefone}"/>															
					</div>
					
					<div class="col-sm-8  form-group  sv-required" salvavidas:classforerror="email">					
						<label class="control-label" for="email">E-mail</label> 
						<input class="form-control" type="text" id="email" th:field="*{email}"/>															
					</div>
				</div>
		
				<div class="row">
					<div class="col-sm-4  form-group">
						<label class="control-label" for="logradouro">Logradouro</label>
						<input class="form-control" type="text" id="logradouro" th:field="*{endereco.logradouro}"/>
					</div>
					
					<div class="col-sm-4  form-group">
						<label class="control-label" for="numero">Número</label>
						<input class="form-control" type="text" id="numero" th:field="*{endereco.numero}"/>
					</div>
					
					<div class="col-sm-4  form-group">
						<label class="control-label" for="complemento">Complemento</label>
						<input class="form-control" type="text" id="complemento" th:field="*{endereco.complemento}"/>						
					</div>
				</div>
				
				
				<div class="row">					
					<div class="col-sm-4  form-group">
						<label class="control-label" for="cep">CEP</label>
						<input class="form-control  js-cep" type="text" id="cep" th:field="*{endereco.cep}"/>
					</div>
					
					<div class="col-sm-4  form-group">
						<label class="control-label" for="estado">Estado</label>
						<select class="form-control" id="estado" th:field="*{endereco.estado}">
							<option value="">Selecione o estado</option>							
							<option th:each="estado : ${estados}" th:value="${estado.codigo}" th:text="${estado.nome}">
								São Paulo
							</option>							
						</select>											
					</div>
					
					<div class="col-sm-4  form-group">
						<label class="control-label" for="cidade">Cidade</label>
						<div class="sv-field-action">
							<input type="hidden" id="inputHiddenCidadeSelecionada" th:value="*{endereco.cidade} != null ? *{endereco.cidade.codigo}">
							<select class="form-control" id="cidade" th:data-url="@{/cidades}" th:field="*{endereco.cidade}">
													
							</select>
							
							<div class="sv-field-action__icon  js-img-loading" style="display: none;">
								<img th:src="@{/images/mini-loading.gif}">
							</div>
						</div>																	
					</div>
				</div>
				
				<div class="form-group">
					<button class="btn  btn-primary" type="submit">Salvar</button>
				</div>
		
			</form>
		</div>
		
	</section>
	
	<th:block layout:fragment="javascript-extra">
		<script th:src="@{/javascripts/cliente.mascara-cpf-cnpj.js}"></script>
		<script th:src="@{/javascripts/cliente.combo-estado-cidade.js}"></script>	
	</th:block>
</body>

</html>
