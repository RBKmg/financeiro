<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:salvavidas="http://salvavidas.net"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">
	
<head>
	<title>Pesquisa de clientes</title>
</head>

<body>	
	<section layout:fragment="conteudo">

		<div class="page-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-xs-10">
						<h1>
							Pesquisa de clientes
						</h1>
					</div>
					
					<div class="col-xs-2" sec:authorize-url="/clientes/novo">
						<div class="aw-page-header-controls">
							<a class="btn  btn-default" th:href="@{/clientes/novo}">
								<i class="glyphicon  glyphicon-plus-sign"></i>
								<span class="hidden-xs  hidden-sm">Novo cliente</span>						
							</a>
						</div>
					</div>
				</div>				
			</div>
		</div>

		<div class="container-fluid">
		
			<form method="GET" class="form-vertical  js-form-loading" th:object="${clientesFilter}">				
				
				<div class="row">
					<div class="form-group  col-sm-8">						
						<label class="control-label" for="nome">Nome</label>
						<input class="form-control" type="text" id="nome" th:field="*{nome}"/>		
					</div>
					
					<div class="form-group  col-sm-4">						
						<label class="control-label" for="cpfOuCnpj">CPF/CNPJ</label>
						<input class="form-control" type="text" id="cpfOuCnpj" th:field="*{cpfOuCnpj}"/>		
					</div>
				</div>				
				
				<div class="form-group">
					<button class="btn  btn-primary" type="submit">Pesquisar</button>
				</div>
		
			</form>
			
			<div class="table-responsive  sv-tabela-simples">
				<table class="table  table-hover">
					<thead>
						<tr>
							<th class="table-clientes-col-nome">
								<salvavidas:ordenacao page="${pagina}" field="nome" text="Nome"/>
							</th>
							<th class="table-clientes-col-tipoPessoa">
								<salvavidas:ordenacao page="${pagina}" field="tipoPessoa" text="Tipo Pessoa"/>
							</th>
							<th class="table-clientes-col-cpfOuCnpj">
								CPF/CNPJ
							</th>
							<th class="table-clientes-col-telefone">
								Telefone
							</th>
							<th class="table-clientes-col-cidade-estado">
								Cidade
							</th>						
													
							<th class="col-acoes"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="cliente : ${pagina.conteudo}">
							<td th:text="${cliente.nome}">Ricardo</td>
							<td class="text-center" th:text="${cliente.tipoPessoa.descricao}">Física</td>
							<td class="text-right" th:text="${cliente.cpfOuCnpj}">000.000.000-00</td>
							<td class="text-right" th:text="${cliente.telefone}">(00) 00000-0000</td>
							<td class="text-right" th:text="${cliente.endereco.nomeCidadeSiglaEstado}">São Paulo/SP</td>
							<td class="text-center">
								<a class="btn  btn-link  btn-xs  js-tooltip" title="Editar" sec:authorize="hasRole('ROLE_CADASTRAR_CLIENTE')"
									href="#" th:href="@{/clientes/{codigo}(codigo=${cliente.codigo})}">
									<i class="glyphicon  glyphicon-pencil"></i>
								</a>
								
								<a class="btn  btn-link  btn-xs  js-tooltip  js-excluir-btn" title="Excluir" href="#"
									data:url="@{/clientes/{codigo}(codigo=${cliente.codigo})}" data:objeto="${cliente.nome}"
									 sec:authorize="hasRole('ROLE_DELETAR_CLIENTE')">
									<i class="glyphicon  glyphicon-remove"></i>
								</a>
							</td>
						</tr>
						
						<tr th:if="${#lists.isEmpty(pagina.conteudo)}">
							<td colspan="5">Nenhum cliente encontrado</td>
						</tr>
					</tbody> 
				</table>
			</div>

			<salvavidas:paginacao page="${pagina}"/>
			
		</div>
		
	</section>	
</body>

</html>
