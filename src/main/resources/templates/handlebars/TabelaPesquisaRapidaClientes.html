<script id="tabela-pesquisa-rapida-clientes" type="text/x-handlebars-template">
	
	<div class="table-responsive  sv-tabela-simples" style="margin-top: 15px">
		<table class="table  table-hover">
			<thead>
				<tr>
					<th class="col-sm-2">Nome</th>
					<th class="col-sm-2">Telefone</th>
				</tr>
			</thead>

			<tbody>
				{{#if .}}
					{{#each .}}
						<tr class="js-cliente-filtrado-na-pesquisa-rapida" data-codigo="{{codigo}}" data-nome="{{nome}}">
							<td>{{nome}}</td>
							<td>{{telefone}}</td>
						</tr>
					{{/each}}
				{{else}}
					<tr>
						<td colspan="2">Nenhum cliente encontrado</td>
					</tr>
				{{/if}}
			</tbody>
		</table>
	</div>
	
</script>
