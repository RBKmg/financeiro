<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}"
	xmlns:salvavidas="http://salvavidas.net"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">
	
<head>
	<title>Pesquisa de lançamentos</title>
	
	<meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>

<body>	
	<section layout:fragment="conteudo">

		<div class="page-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-xs-10">
						<h1>
							Pesquisa de lançamentos
						</h1>
					</div> 
					
					<div class="col-xs-2" sec:authorize-url="/lancamentos/novo">
						<div class="aw-page-header-controls">
							<a class="btn  btn-default" th:href="@{/lancamentos/novo}">
								<i class="glyphicon  glyphicon-plus-sign"></i>
								<span class="hidden-xs  hidden-sm">Novo lançamento</span>						
							</a>
						</div>
					</div>
				</div>				
			</div>
		</div>

		<div class="container-fluid">
		
			<form method="GET" class="form-vertical  js-form-loading" th:object="${lancamentosFilter}">				
		
				<div class="form-group">						
					<label class="control-label" for="descricao">Descrição</label>
					<input class="form-control" type="text" id="descricao" th:field="*{descricao}"/>		
				</div>						
				
				<div class="row">
					<div class="form-group  col-sm-6">						
						<label class="control-label" for="dataVencimentoDe">Vencimento</label>						
						<div class="form-inline">
							<input class="form-control  aw-form-control-inline-sm  js-date" type="text" id="dataVencimentoDe" 
								autocomplete="off" th:field="*{dataVencimentoDe}"/>
							<label for="dataVencimentoAte" class="aw-form-label-between">até</label>
							<input class="form-control  aw-form-control-inline-sm  js-date" type="text" id="dataVencimentoAte"
								autocomplete="off" th:field="*{dataVencimentoAte}"/>
						</div>
					</div>
				</div>
					
				
				<div class="form-group">
					<button class="btn  btn-primary" type="submit">Pesquisar</button>
				</div>
		
			</form>
			
			<div class="table-responsive  sv-tabela-simples">
				<table class="table  table-hover">
					<thead>
						<tr>
							<th class="table-lancamentos-col-pessoa">
								Pessoa
							</th>
							<th class="table-lancamentos-col-descricao">
								<salvavidas:ordenacao page="${pagina}" field="descricao" text="Descrição"/>
							</th>
							<th class="table-lancamentos-col-vencimento">
								<salvavidas:ordenacao page="${pagina}" field="dataVencimento" text="Vencimento"/>
							</th>
							<th class="table-lancamentos-col-pagamento">
								Pagamento
							</th>
							<th class="table-lancamentos-col-valor">
								Valor
							</th>						
													
							<th class="col-acoes"></th>
						</tr>
					</thead>
					
					<tbody>
						<tr th:each="lancamento : ${pagina.conteudo}">
							<td th:text="${lancamento.usuario.nome}">Ricardo</td>
							<td class="text-left" th:text="${lancamento.descricao}">Sacola da 7º tradição</td>
							<td class="text-right" th:text="${{lancamento.dataVencimento}}">01/09/2023</td>
							<td class="text-right" th:text="${{lancamento.dataPagamento}}"></td>
							<td class="text-right" th:with="receita=${lancamento.tipo == T(com.ricardo.financeiro.model.TipoLancamento).RECEITA}">
								<div th:if="${receita}">
									<span style="color: blue;" th:text="|R$ ${{lancamento.valor}}|">R$ 50,00</span>
								</div>
								<div th:unless="${receita}">
									<span style="color: red;" th:text="|R$ ${{lancamento.valor}}|">R$ 50,00</span>
								</div>
							</td>
							
							<td class="text-center">
								<a class="btn  btn-link  btn-xs  js-tooltip" title="Editar" sec:authorize="hasRole('ROLE_CADASTRAR_LANCAMENTO')"
									href="#" th:href="@{lancamentos/{codigo}(codigo=${lancamento.codigo})}">
									<i class="glyphicon  glyphicon-pencil"></i>
								</a>
								
								<a class="btn  btn-link  btn-xs  js-tooltip  js-excluir-btn" title="Excluir" href="#"
									th:data-objeto="${lancamento.descricao}" th:data-url="@{/lancamentos/{codigo}(codigo=${lancamento.codigo})}"
									sec:authorize="hasRole('ROLE_DELETAR_LANCAMENTO')">
									<i class="glyphicon  glyphicon-remove"></i>
								</a>
							</td>
						</tr>
						
						<tr th:if="${pagina.vazia}">
							<td colspan="6">Nenhum lançamento encontrado</td>
						</tr>
					</tbody> 
				</table>
			</div>
			
			<salvavidas:paginacao page="${pagina}"/>
			
		</div>
		
	</section>	
</body>

</html>
