<!DOCTYPE html>
<html lang="pt" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/LayoutPadrao}">
	
<head>
	<title>Cadastro de cidade</title>
</head>

<body>	
	<section layout:fragment="conteudo">

		<div class="page-header">
			<div class="container-fluid">
				<div class="row">
					<div class="col-xs-10">						
						<h1 th:if="${cidade.novo}">Cadastro de cidade</h1>
						<h1 th:unless="${cidade.novo}" th:text="|Edição da ${cidade.nome}|">Edição de cidade</h1>						
					</div>
					
					<div class="col-xs-2">
						<div class="aw-page-header-controls">
							<a class="btn  btn-default" th:href="@{/cidades}">
								<i class="glyphicon  glyphicon-plus-sign"></i>
								<span class="hidden-xs  hidden-sm">Pesquisar</span>						
							</a>
						</div>
					</div>
				</div>				
			</div>
		</div>

		<div class="container-fluid">
		
			<form method="POST" class="form-vertical  js-form-loading" th:object="${cidade}" 
				th:action="${cidade.novo} ? @{/cidades/novo} : @{/cidades/novo/{codigo}(codigo=${cidade.codigo})}">
				
				<salvavidas:msgSuccessOrError/>
				
				<input type="hidden" th:field="*{codigo}">							
				
				<div class="row">					
					<div class="col-sm-4  form-group  sv-required" salvavidas:classforerror="estado">
						<label class="control-label" for="estado">Estado</label>
						<select class="form-control" id="estado" th:field="*{estado}">
							<option value="">Selecione o estado</option>
							<option th:each="estado : ${estados}" th:value="${estado.codigo}" th:text="${estado.nome}">São Paulo</option>
						</select>											
					</div>
					
					<div class="col-sm-8  form-group  sv-required" salvavidas:classforerror="nome">						
						<label class="control-label" for="nome">Nome</label>
						<input class="form-control" type="text" id="nome" th:field="*{nome}"/>						
					</div>
				</div>
				
				<div class="form-group">
					<button class="btn  btn-primary" type="submit">Salvar</button>
				</div>
		
			</form>
		</div>
		
	</section>	
</body>

</html>
